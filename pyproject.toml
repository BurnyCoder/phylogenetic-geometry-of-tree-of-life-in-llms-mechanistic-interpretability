[project]
name = "phylogeo"
version = "0.1.0"
description = "Do LLMs represent animal species on a tree of life? Phylogenetic geometry of species representations in Qwen3.5 and controls."
readme = "README.md"
authors = [{ name = "Libor \"Burny\" Burian" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.16.0",
    "dendropy>=5.1.3",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-bio>=0.7.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

# PyTorch CUDA 13.2 wheels: the RTX 5070 (Blackwell, sm_120) needs CUDA >= 12.8 builds.
# Source: https://pytorch.org/get-started/locally/ and https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs network or a GPU model download (deselect with -m 'not slow')",
    "gpu: needs a CUDA GPU",
]
